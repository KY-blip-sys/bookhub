<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="padding: 32px; max-width: 700px;">

<div id="screen-records" class="page">
  <h1>記録</h1>

  <div class="records-summary">
    <div class="dashboard-tile">
      <span class="dashboard-icon icon-blue">🕐</span>
      <p class="dashboard-value" id="records-total-minutes">0</p>
      <p class="dashboard-label">合計読書時間（分）</p>
    </div>
    <div class="dashboard-tile">
      <span class="dashboard-icon icon-green">📝</span>
      <p class="dashboard-value" id="records-session-count">0</p>
      <p class="dashboard-label">記録回数</p>
    </div>
    <div class="dashboard-tile">
      <span class="dashboard-icon icon-purple">💡</span>
      <p class="dashboard-value" id="records-learning-count">0</p>
      <p class="dashboard-label">学んだこと</p>
    </div>
  </div>

  <ul id="all-records-list" class="record-list"></ul>
</div>

<script src="js/models/storage.js"></script>
<script src="js/models/booksModel.js"></script>
<script src="js/models/categoryModel.js"></script>
<script src="js/screens/allRecords.js"></script>
<script>
var books = [
  {
    id: 1,
    category: "practical",
    title: "深い仕事",
    author: "カル・ニューポート",
    coverImage: null,
    pageCount: 300,
    pageAdjustment: 0,
    records: [
      { date: "2026/8/10", timestamp: 1, minutes: 25, pages: 20, learning: "集中の質が生産性を決める" },
      { date: "2026/8/15", timestamp: 3, minutes: 45, pages: 30, learning: "" }
    ]
  },
  {
    id: 2,
    category: "practical",
    title: "銃・病原菌・鉄",
    author: "ジャレド・ダイアモンド",
    coverImage: null,
    pageCount: 500,
    pageAdjustment: 0,
    records: [
      { date: "2026/8/12", timestamp: 2, minutes: 60, pages: 40, learning: "地理的な要因が文明の発展速度を左右した" }
    ]
  }
];
saveBooks(books);
saveActiveCategory("practical");

// showDetailScreen（本の詳細への遷移）はこのテストページには存在しないため、
// クリック時のエラーを防ぐためのダミー関数を用意しておく
function showDetailScreen(bookId) {
  document.title = "clicked:" + bookId;
}

renderAllRecordsScreen();
</script>

</body>
</html>
